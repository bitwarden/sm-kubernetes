# Sample SecretProviderClass showing the full parameter schema this provider
# understands (see internal/csi/config.go ParseParameters). Copy this into
# your own manifests and adjust organizationId/objects for your environment.
#
# This provider is only reachable through the upstream secrets-store-csi-driver
# (spec.provider below must be "bitwarden", matching csi.ProviderName). See
# ../csi-provider/README.md for how a Pod references this SecretProviderClass
# and provides the Secrets Manager access token via nodePublishSecretRef.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bitwarden-secrets
spec:
  provider: bitwarden
  parameters:
    # Required. The Bitwarden organization ID secrets are pulled from.
    organizationId: "a08a8157-129e-4002-bab4-b118014ca9c7"

    # Optional. Defaults to https://api.bitwarden.com / https://identity.bitwarden.com
    # (self-hosted Bitwarden servers set these to their own API/Identity URLs).
    apiUrl: "https://api.bitwarden.com"
    identityUrl: "https://identity.bitwarden.com"

    # Required. A JSON-encoded array of objects to mount as files (map[string]string
    # values in SecretProviderClass.spec.parameters cannot hold nested structures
    # directly, so this is a JSON string rather than a native YAML list).
    #
    # Each entry identifies a secret by exactly one of bwSecretId or secretName,
    # and names the file it is written to under the CSI volume as fileName.
    # filePermission is optional and, if set, must not grant permissions beyond
    # 0600 (owner read/write only).
    objects: |
      [
        {
          "bwSecretId": "e30f88bd-9e9c-42ae-83b7-b155012da672",
          "fileName": "db-password"
        },
        {
          "secretName": "api-key",
          "fileName": "api-key",
          "filePermission": "0600"
        }
      ]

# This sample intentionally does NOT set spec.secretObjects. That field
# mirrors the mounted objects above into a regular Kubernetes Secret
# (readable via the Kubernetes API / stored in etcd for the Secret's
# lifetime), which reintroduces the persisted-copy-of-the-secret problem
# this CSI provider exists to avoid. It is an opt-in, upstream-driver
# feature, not something this provider implements -- see the
# "Optional: syncing to a Kubernetes Secret (secretObjects)" section in
# ../csi-provider/README.md before enabling it.
