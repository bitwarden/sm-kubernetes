# Runs the Bitwarden provider for the upstream secrets-store-csi-driver on
# every node. The provider listens on a Unix Domain Socket under
# /etc/kubernetes/secrets-store-csi-providers, a hostPath shared with the
# driver's own node pods so they can dial this provider's socket to service
# Mount RPCs for pods scheduled on the same node.
#
# KEPT IN SYNC WITH: chart/templates/daemonset.yaml. There is no shared
# source of truth between this plain manifest and the Helm chart template,
# so any change to a security-relevant field below (securityContext,
# capabilities, resources, tolerations, priorityClassName, volumes/
# volumeMounts) must be mirrored by hand in the chart template (and its
# chart/values.yaml defaults). This is enforced automatically by
# config/csi-provider/parity/manifest_parity_test.go (run via `go test ./...`
# or `make verify-manifest-parity`, and wired into CI in
# .github/workflows/build.yml), which renders both with:
#   diff <(kubectl kustomize config/csi-provider) \
#        <(helm template sync config/csi-provider/chart --namespace kube-system \
#            --set fullnameOverride=bitwarden-csi-provider)
# and fails the build if the security-relevant fields diverge.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bitwarden-csi-provider
  namespace: kube-system
  labels:
    app.kubernetes.io/name: daemonset
    app.kubernetes.io/instance: bitwarden-csi-provider
    app.kubernetes.io/component: csi-provider
    app.kubernetes.io/created-by: sm-operator
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bitwarden-csi-provider
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bitwarden-csi-provider
    spec:
      serviceAccountName: bitwarden-csi-provider
      automountServiceAccountToken: false
      # Runs on every node, including control-plane/tainted nodes, so pods
      # scheduled anywhere in the cluster can reach a local provider socket.
      tolerations:
        - operator: Exists
      # Matches the priority the upstream secrets-store-csi-driver itself
      # runs at, since Mount RPCs to this provider are on the critical path
      # for pod volume mounting on the node.
      priorityClassName: system-node-critical
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # kubelet creates the provider-socket hostPath below as root:root 0755
      # the first time it's needed (DirectoryOrCreate) and never chowns it
      # for fsGroup, since fsGroup does not apply to hostPath volumes. The
      # non-root provider container cannot create its Unix socket inside a
      # directory it can't write to, so this init container -- and only this
      # init container -- runs as root, purely to chmod that one shared
      # directory before the long-running provider process starts.
      initContainers:
        - name: init-provider-socket-dir
          image: busybox:1.36
          command: ["sh", "-c", "chmod 0777 /etc/kubernetes/secrets-store-csi-providers"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: provider-socket
              mountPath: /etc/kubernetes/secrets-store-csi-providers
      containers:
        - name: bitwarden-csi-provider
          image: csi-provider:latest
          imagePullPolicy: IfNotPresent
          args:
            - --endpoint=/etc/kubernetes/secrets-store-csi-providers/bitwarden.sock
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: provider-socket
              mountPath: /etc/kubernetes/secrets-store-csi-providers
            # The provider keeps a bounded, idle-evicting cache of logged-in
            # Secrets Manager SDK sessions under a per-session state
            # directory created at runtime via os.MkdirTemp under the
            # default temp directory. readOnlyRootFilesystem requires that
            # temp directory to be a writable mount.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: provider-socket
          hostPath:
            path: /etc/kubernetes/secrets-store-csi-providers
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
