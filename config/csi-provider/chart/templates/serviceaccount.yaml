{{- /*
This provider never calls the Kubernetes API (see ../../README.md): the
upstream secrets-store-csi-driver resolves nodePublishSecretRef itself before
ever calling this provider's Mount RPC. So only a ServiceAccount is templated
here -- no Role, ClusterRole, RoleBinding, or ClusterRoleBinding -- and its
token is never auto-mounted.

KEPT IN SYNC WITH: ../../rbac.yaml. There is no shared source of truth
between this chart template and the plain kustomize manifest -- if RBAC
scope changes here (e.g. a Role/RoleBinding becomes necessary), mirror the
same scope in ../../rbac.yaml. See ../../daemonset.yaml for the diff command
used to check the two render equivalently.
*/ -}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bitwarden-csi-provider.serviceAccountName" . }}
  labels:
    {{- include "bitwarden-csi-provider.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end -}}
